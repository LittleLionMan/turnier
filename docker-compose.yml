services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://turnier:${POSTGRES_PASSWORD}@db:5432/turnier
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./fotos:/app/fotos:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnier
      POSTGRES_DB: turnier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnier -d turnier"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
